<div class="page-header">

  <div class="header-info">
    <h2>Classes</h2>
    <p>Manage classes and student groups</p>
  </div>

  <button
    mat-raised-button
    color="primary"
    routerLink="/admin/classes/new">

    <mat-icon>add</mat-icon>
    New Class

  </button>

</div>

@if (loading()) {

  <div class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

} @else {

  <mat-card class="table-card">

    <table
      mat-table
      [dataSource]="classes()"
      class="full-width">

      <!-- Name -->

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
          Name
        </th>

        <td mat-cell *matCellDef="let cls">
          {{ cls.name }}
        </td>
      </ng-container>

      <!-- Description -->

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>
          Description
        </th>

        <td mat-cell *matCellDef="let cls">
          {{ cls.description || '—' }}
        </td>
      </ng-container>

      <!-- Student Count -->

      <ng-container matColumnDef="studentCount">
        <th mat-header-cell *matHeaderCellDef>
          Students
        </th>

        <td mat-cell *matCellDef="let cls">
          {{ cls.studentCount }}
        </td>
      </ng-container>

      <!-- Status -->

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>
          Status
        </th>

        <td mat-cell *matCellDef="let cls">

          <div class="status-wrapper">

            <mat-chip
              [class.active-chip]="cls.isActive"
              [class.inactive-chip]="!cls.isActive">

              {{ cls.isActive ? 'Active' : 'Inactive' }}

            </mat-chip>

          </div>

        </td>
      </ng-container>

      <!-- Actions -->

      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let cls">

          <div class="actions-cell">

            <button
              mat-icon-button
              color="primary"
              matTooltip="Edit Class"
              [routerLink]="['/admin/classes', cls.id, 'edit']">

              <mat-icon>edit</mat-icon>

            </button>

            <button
              mat-icon-button
              color="warn"
              matTooltip="Deactivate Class"
              (click)="deactivate(cls.id, cls.name)"
              [disabled]="!cls.isActive">

              <mat-icon>block</mat-icon>

            </button>

          </div>

        </td>

      </ng-container>

      <!-- Rows -->

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>

    </table>

  </mat-card>

}
